name: R package
on: [push, pull_request]
jobs:
  r-check:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
    steps:
      - uses: actions/checkout@v4
      - name: r/src matches src/
        run: |
          bash tools/sync_r_src.sh
          git diff --exit-code r/src
          test -z "$(git status --porcelain r/src)"   # also catches new, uncommitted copies
      - uses: r-lib/actions/setup-r@v2
      - name: gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: R CMD build
        run: R CMD build r
      - name: R CMD check
        run: R CMD check --no-manual --as-cran fortvine_*.tar.gz
      - name: check log
        if: always()
        run: cat fortvine.Rcheck/00check.log || true
