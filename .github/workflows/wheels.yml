name: Python wheels

# Build the sdist of the Python package (python/, with src/ and LICENSE copied in), then
# py3-none-<platform> wheels from that sdist. A published GitHub release with a v* tag
# uploads them to PyPI (secret PYPI_API_TOKEN); a manual run can upload them to TestPyPI
# (secret TEST_PYPI_API_TOKEN).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Upload to TestPyPI
        type: boolean
        default: false
  pull_request:
    paths: ["python/**", "src/**", ".github/workflows/wheels.yml"]

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the sdist
        run: pipx run build --sdist python --outdir dist
      - name: the sdist builds and passes the tests outside the repository
        run: |
          sudo apt-get update && sudo apt-get install -y gfortran
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.tar.gz pytest
          mkdir /tmp/t && tar xzf dist/*.tar.gz -C /tmp/t && cd /tmp && OMP_NUM_THREADS=2 /tmp/v/bin/pytest /tmp/t/*/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: wheel ${{ matrix.os }}
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-15            # arm64
            macos_target: "15.0"
          - os: macos-15-intel      # x86_64
            macos_target: "15.0"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: sdist
      - name: locate the sdist
        shell: bash
        run: echo "SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - name: "gfortran (Windows: MinGW-w64)"
        if: runner.os == 'Windows'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13
      - name: "gfortran (macOS: Homebrew gcc)"
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "FC=$(ls $(brew --prefix)/bin/gfortran-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v2.23.3
        with:
          package-dir: ${{ env.SDIST }}
          output-dir: wheelhouse
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
          OMP_NUM_THREADS: "2"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  pypi:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
