name: Python package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: install (compiles src/ into the package)
        run: pip install ./python pytest numpy
      - name: test
        env:
          OMP_NUM_THREADS: "2"
        run: pytest python/tests -q
