site_name: fortvine
site_description: Vine copulas in Fortran - 111 pair-copula families with exact parameter scores, vine selection, density, Rosenblatt transforms and simulation
site_author: Shahab Aldin Shojaeezadeh
site_url: https://bluerrror.github.io/fortvine/
repo_url: https://github.com/Bluerrror/fortvine
repo_name: Bluerrror/fortvine
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Shahab Aldin Shojaeezadeh &mdash; GNU GPL v3 or later

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Source Serif 4
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - Concepts: getting-started/concepts.md
  - Manual:
      - manual/index.md
      - Pair copulas (fv_bicop): manual/bicop.md
      - Vine copulas (fv_vinecop): manual/vinecop.md
      - Fitting and selection: manual/fitting.md
      - Controls (fv_controls): manual/controls.md
      - Rotations and asymmetry: manual/rotations.md
      - Discrete and mixed data: manual/discrete.md
      - Nonparametric families: manual/nonparametric.md
      - The generic engine: manual/generic.md
      - Performance and threads: manual/performance.md
      - C interface: manual/c-api.md
  - Families:
      - families/index.md
      - Elliptical: families/elliptical.md
      - Archimedean: families/archimedean.md
      - Extreme-value: families/extreme-value.md
      - Archimax: families/archimax.md
      - Khoudraji asymmetrisation: families/khoudraji.md
      - Other parametric: families/other.md
      - Nonparametric: families/nonparametric.md
      - Complete catalogue: families/catalogue.md
  - Examples:
      - examples/index.md
      - Pair copula basics: examples/pair-copula.md
      - Vine copula workflow: examples/vine.md
      - Generic families: examples/generic.md
      - Tail dependence and asymmetry: examples/tails.md
      - Weighted and discrete data: examples/weights-discrete.md
      - Calling fortvine from Python and C: examples/interop.md
  - Python package: python.md
  - R package: r.md
  - Benchmarks: benchmarks.md
  - API reference:
      - api/index.md
      - fv_bicop: api/bicop.md
      - fv_vinecop: api/vinecop.md
      - fv_controls: api/controls.md
      - Functions: api/functions.md
      - Family codes and constants: api/constants.md
  - Theory:
      - Numerics and stability: theory/numerics.md
      - Exact parameter scores: theory/scores.md
      - Validation: theory/validation.md
  - References: references.md
  - Changelog: changelog.md
